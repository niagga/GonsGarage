# GonsGarage — producción / LAN.
# Dedicated Postgres (P0-T1 cutover): service name `postgres` matches DATABASE_URL host.
# Do NOT attach docker-compose.prod.arnela-network.yml for routine prod (isolation from Arnela).
# Do NOT use `docker compose ... --remove-orphans` unless postgres is declared here — otherwise
# a server-only postgres container can be deleted.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Fiscal dark launch: leave FISCAL_* switches false (defaults). Schema:
#   docker compose -f docker-compose.prod.yml --profile fiscal --env-file .env.prod run --rm gonsgarage-migrate
# See docs/fiscal-integration-runbook.md. Never enable finalization/worker until parent gates 13.2–13.4.
#
# Puerto público del stack: 8102 → nginx → front + /api/* al API.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gonsgarage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gonsgarage_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod (same as DATABASE_URL password)}
      POSTGRES_DB: ${POSTGRES_DB:-gonsgarage}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gonsgarage-network

  redis:
    image: redis:8-alpine
    container_name: gonsgarage-redis
    restart: unless-stopped
    networks:
      - gonsgarage-network

  gonsgarage-migrate:
    profiles: ["fiscal"]
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    container_name: gonsgarage-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      MIGRATIONS_DIR: /migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gonsgarage-network
    restart: "no"

  gonsgarage-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gonsgarage-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      GIN_MODE: ${GIN_MODE:-release}
      SERVER_PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.prod}
      APP_ENV: ${APP_ENV:-production}
      FISCAL_FEATURE_ENABLED: ${FISCAL_FEATURE_ENABLED:-false}
      FISCAL_FINALIZATION_ENABLED: ${FISCAL_FINALIZATION_ENABLED:-false}
      FISCAL_WORKER_ENABLED: ${FISCAL_WORKER_ENABLED:-false}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_CLOUDWARE_MUTATIONS: ${FISCAL_CLOUDWARE_MUTATIONS:-false}
      FISCAL_ARTIFACT_BACKEND: ${FISCAL_ARTIFACT_BACKEND:-object}
      FISCAL_CREDENTIAL_KEY_VERSION: ${FISCAL_CREDENTIAL_KEY_VERSION:-}
      FISCAL_CREDENTIAL_KEY_B64: ${FISCAL_CREDENTIAL_KEY_B64:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gonsgarage-network

  gonsgarage-fiscal-worker:
    profiles: ["fiscal"]
    build:
      context: ./backend
      dockerfile: Dockerfile.fiscal-worker
    container_name: gonsgarage-fiscal-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.prod}
      APP_ENV: ${APP_ENV:-production}
      FISCAL_WORKER_ENABLED: ${FISCAL_WORKER_ENABLED:-false}
      FISCAL_FINALIZATION_ENABLED: ${FISCAL_FINALIZATION_ENABLED:-false}
      FISCAL_FEATURE_ENABLED: ${FISCAL_FEATURE_ENABLED:-false}
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-}
      FISCAL_ARTIFACT_BACKEND: ${FISCAL_ARTIFACT_BACKEND:-object}
      FISCAL_ARTIFACT_PRIVATE_ACL: ${FISCAL_ARTIFACT_PRIVATE_ACL:-false}
      FISCAL_ARTIFACT_ENCRYPTION: ${FISCAL_ARTIFACT_ENCRYPTION:-false}
      FISCAL_ARTIFACT_RETENTION: ${FISCAL_ARTIFACT_RETENTION:-false}
      FISCAL_ARTIFACT_BACKUP_RESTORE: ${FISCAL_ARTIFACT_BACKUP_RESTORE:-false}
      FISCAL_ARTIFACT_ACCESS_LOG: ${FISCAL_ARTIFACT_ACCESS_LOG:-false}
      FISCAL_ARTIFACT_OBJECT_ENDPOINT: ${FISCAL_ARTIFACT_OBJECT_ENDPOINT:-}
      FISCAL_ARTIFACT_OBJECT_BUCKET: ${FISCAL_ARTIFACT_OBJECT_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - gonsgarage-network

  gonsgarage-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.prod}
    container_name: gonsgarage-frontend
    restart: unless-stopped
    depends_on:
      - gonsgarage-api
    networks:
      - gonsgarage-network

  gonsgarage-nginx:
    image: nginx:alpine
    container_name: gonsgarage-nginx
    restart: unless-stopped
    ports:
      - "8102:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gonsgarage-frontend
      - gonsgarage-api
    networks:
      - gonsgarage-network

networks:
  gonsgarage-network:
    driver: bridge
